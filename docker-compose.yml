version: "3.9"

name: echoscene-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: echoscene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echoscene
      POSTGRES_USER: echoscene
      POSTGRES_PASSWORD: echoscene_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoscene -d echoscene"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echoscene_net

  chromadb:
    image: chromadb/chroma:latest
    container_name: echoscene-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - echoscene_net

  minio:
    image: minio/minio:latest
    container_name: echoscene-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: echoscene
      MINIO_ROOT_PASSWORD: echoscene_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - echoscene_net

volumes:
  postgres_data:
  chroma_data:
  minio_data:

networks:
  echoscene_net:
    driver: bridge
